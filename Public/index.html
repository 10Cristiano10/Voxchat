<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Nexus Mobile Workspace</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

  <style>
    :root {
      --primary: #3b82f6;
      --bg-app: #0b1329;
      --bg-surface: #111e38;
      --bg-card: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-app) !important;
      color: var(--text-main);
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    input,
    textarea {
      user-select: text;
    }

    .bg-primary {
      background-color: var(--primary) !important;
    }

    .text-primary {
      color: var(--primary) !important;
    }

    .border-primary {
      border-color: var(--primary) !important;
    }

    .ring-primary {
      --tw-ring-color: var(--primary) !important;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-app);
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    .modal-backdrop {
      background: rgba(2, 6, 23, .86);
      backdrop-filter: blur(4px);
    }

    .img-preview-container {
      position: relative;
      display: inline-block;
    }

    .img-preview-container .remove-btn {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #ef4444;
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
    }

    .mobile-tab-active {
      color: var(--primary) !important;
    }

    .subtab-active {
      border-bottom: 2px solid var(--primary);
      color: var(--primary) !important;
      font-weight: 600;
    }

    .msg-item {
      touch-action: manipulation;
      contain: content;
    }

    .media-message {
      max-width: min(320px, 75vw);
      max-height: 320px;
      object-fit: contain;
    }

    .profile-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .voice-speaking {
      box-shadow: 0 0 0 2px #22c55e;
    }

    button {
      touch-action: manipulation;
    }
  </style>
</head>

<body class="h-screen w-screen flex flex-col">

<!-- =========================================================
     AUTENTICAÇÃO
========================================================= -->

<div id="authScreen"
     class="fixed inset-0 z-50 bg-[#0b1329] flex items-center justify-center p-4">

  <div class="bg-[#111e38] w-full max-w-sm rounded-2xl shadow-2xl p-6 border border-[#1e293b]">

    <div class="text-center mb-6">

      <div class="w-12 h-12 bg-primary/20 text-primary rounded-2xl
                  flex items-center justify-center mx-auto mb-3 text-xl font-bold">

        <i class="fa-solid fa-cube"></i>

      </div>

      <h2 id="authTitle"
          class="text-lg font-bold text-slate-100">
        Bem-vindo ao Nexus
      </h2>

      <p id="authSubtitle"
         class="text-xs text-slate-400 mt-1">
        Faça login para entrar no workspace
      </p>

    </div>

    <div class="space-y-4">

      <div id="registerFields" class="hidden space-y-4">

        <div>

          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">
            Nome de Exibição
          </label>

          <input
            id="authNameInput"
            type="text"
            placeholder="Seu Nome"
            class="w-full bg-[#0b1329] text-slate-100 px-3 py-2.5 rounded-xl
                   text-xs border border-[#1e293b] focus:outline-none focus:border-primary"
          >

        </div>

      </div>

      <div>

        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">
          E-mail
        </label>

        <input
          id="authEmailInput"
          type="email"
          placeholder="seu@email.com"
          class="w-full bg-[#0b1329] text-slate-100 px-3 py-2.5 rounded-xl
                 text-xs border border-[#1e293b] focus:outline-none focus:border-primary"
        >

      </div>

      <div>

        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">
          Senha
        </label>

        <input
          id="authPasswordInput"
          type="password"
          placeholder="••••••••"
          class="w-full bg-[#0b1329] text-slate-100 px-3 py-2.5 rounded-xl
                 text-xs border border-[#1e293b] focus:outline-none focus:border-primary"
        >

      </div>

      <button
        onclick="handleAuthSubmit()"
        id="authSubmitBtn"
        class="w-full bg-primary text-white py-2.5 rounded-xl text-xs
               font-semibold shadow transition hover:bg-blue-600">

        Entrar

      </button>

      <div class="text-center pt-2">

        <button
          onclick="toggleAuthMode()"
          id="authSwitchBtn"
          class="text-xs text-slate-400 hover:text-slate-200">

          Não tem uma conta?
          <span class="text-primary font-semibold">
            Cadastre-se
          </span>

        </button>

      </div>

    </div>

  </div>

</div>

<!-- ÁUDIOS REMOTOS -->
<div id="remoteAudios" class="hidden"></div>

<div class="flex-1 flex overflow-hidden relative">

<!-- =========================================================
     SIDEBAR
========================================================= -->

<div id="leftSidebar"
     class="absolute md:relative z-30 w-full md:w-72 h-full
            bg-[#111e38] flex flex-col flex-shrink-0
            border-r border-[#1e293b]
            transition-transform duration-200
            md:translate-x-0">

  <div id="serverHeaderBanner"
       class="h-28 relative bg-primary bg-cover bg-center
              flex flex-col justify-end p-3 shadow-inner flex-shrink-0">

    <div class="absolute inset-0 bg-gradient-to-t
                from-[#111e38] via-[#111e38]/60 to-transparent">
    </div>

    <div class="relative z-10 flex items-center justify-between">

      <div class="flex items-center gap-2 min-w-0">

        <span id="currentServerTitle"
              class="truncate font-bold text-base text-slate-100">

          Workspace dos Amigos

        </span>

        <i class="fa-solid fa-chevron-down text-xs text-slate-300"></i>

      </div>

      <button
        onclick="triggerServerBannerInput()"
        class="bg-black/50 hover:bg-black/70 text-white
               w-7 h-7 rounded-full flex items-center justify-center text-xs">

        <i class="fa-solid fa-camera"></i>

      </button>

      <input
        type="file"
        id="serverBannerFileInput"
        accept="image/*"
        class="hidden"
        onchange="handleServerBannerSelect(event)"
      >

    </div>

  </div>

  <div class="flex-1 overflow-y-auto px-3 py-3 space-y-4">

    <div>

      <p class="px-2 mb-2 text-xs font-bold text-slate-400 uppercase tracking-wider">
        Canais de Texto
      </p>

      <div id="textChannelsList" class="space-y-1"></div>

    </div>

    <div>

      <p class="px-2 mb-2 text-xs font-bold text-slate-400 uppercase tracking-wider">
        Canais de Voz
      </p>

      <div id="voiceChannelsList" class="space-y-2"></div>

    </div>

  </div>

  <div id="voiceConnectedPanel"
       class="hidden bg-emerald-950/40 p-3 border-t border-emerald-900/50">

    <div class="flex items-center justify-between">

      <div class="flex items-center gap-2">

        <i class="fa-solid fa-wifi text-emerald-400 text-sm animate-pulse"></i>

        <div>

          <div class="text-xs font-bold text-emerald-300">
            Voz Conectada
          </div>

          <div id="connectedVoiceChannelName"
               class="text-[11px] text-emerald-400 truncate">

            🔊 Sala Geral

          </div>

        </div>

      </div>

      <button
        onclick="disconnectVoice()"
        class="text-rose-400 p-2 rounded hover:bg-rose-950/50">

        <i class="fa-solid fa-phone-slash text-base"></i>

      </button>

    </div>

  </div>

  <div class="h-16 bg-[#0b1329] px-3 border-t border-[#1e293b]
              flex items-center justify-between">

    <div
      onclick="openProfileModal()"
      class="flex items-center gap-2.5 cursor-pointer flex-1 min-w-0 mr-1">

      <img
        id="userAvatarBar"
        src=""
        class="w-9 h-9 rounded-full border-2 border-primary
               object-cover bg-slate-800"
      >

      <div class="flex flex-col min-w-0">

        <span
          id="userNameBar"
          class="text-xs font-bold text-slate-100 truncate">
        </span>

        <span
          id="userTagBar"
          class="text-[10px] text-slate-400 truncate">
          Online
        </span>

      </div>

    </div>

    <div class="flex items-center text-slate-400 gap-1">

      <button
        id="btnMuteMic"
        onclick="toggleMuteMic()"
        class="w-8 h-8 rounded-lg flex items-center
               justify-center hover:bg-slate-800 text-slate-300">

        <i class="fa-solid fa-microphone text-sm"></i>

      </button>

      <button
        id="btnDeafen"
        onclick="toggleDeafen()"
        class="w-8 h-8 rounded-lg flex items-center
               justify-center hover:bg-slate-800 text-slate-300">

        <i class="fa-solid fa-headphones text-sm"></i>

      </button>

      <button
        onclick="openProfileModal()"
        class="w-8 h-8 rounded-lg flex items-center
               justify-center hover:bg-slate-800 text-slate-300">

        <i class="fa-solid fa-gear text-sm"></i>

      </button>

      <button
        onclick="logout()"
        class="w-8 h-8 rounded-lg flex items-center
               justify-center hover:bg-rose-950/50 text-rose-400">

        <i class="fa-solid fa-right-from-bracket text-sm"></i>

      </button>

    </div>

  </div>

</div>

<!-- =========================================================
     CHAT
========================================================= -->

<div id="chatView"
     class="flex-1 flex flex-col min-w-0 z-10 bg-[#0b1329]">

  <div class="h-14 border-b border-[#1e293b] px-4
              flex items-center justify-between flex-shrink-0
              bg-[#111e38] shadow-sm">

    <div class="flex items-center gap-2 min-w-0">

      <button
        onclick="toggleMobileSidebar()"
        class="md:hidden text-slate-300 p-1.5">

        <i class="fa-solid fa-bars text-lg"></i>

      </button>

      <i class="fa-solid fa-hashtag text-slate-400 text-lg"></i>

      <span
        id="channelHeaderName"
        class="font-bold text-slate-100 truncate text-base">

        geral

      </span>

    </div>

    <button
      onclick="toggleMembersSidebar()"
      class="p-2 text-slate-300 hover:text-white">

      <i class="fa-solid fa-users text-lg"></i>

    </button>

  </div>

  <div
    id="chatMessages"
    class="flex-1 overflow-y-auto p-4 space-y-3">
  </div>

  <div class="p-3 bg-[#111e38] border-t border-[#1e293b]">

    <div
      id="imagePreviewContainer"
      class="hidden mb-2 bg-[#1e293b] p-2 rounded-lg
             border border-[#334155] inline-block">

      <div class="img-preview-container">

        <img
          id="imagePreview"
          src=""
          class="max-h-24 rounded object-cover border border-[#334155]"
        >

        <div
          onclick="cancelImageUpload()"
          class="remove-btn">

          <i class="fa-solid fa-xmark"></i>

        </div>

      </div>

    </div>

    <div
      class="bg-[#1e293b] rounded-xl px-3 py-1.5
             flex items-center gap-2 border border-[#334155]">

      <button
        onclick="triggerFileInput()"
        class="text-slate-400 hover:text-primary p-1.5">

        <i class="fa-solid fa-image text-lg"></i>

      </button>

      <input
        type="file"
        id="fileInput"
        accept="image/*"
        class="hidden"
        onchange="handleFileSelect(event)"
      >

      <button
        onclick="openGifModal()"
        class="text-slate-400 hover:text-primary p-1.5">

        <i class="fa-solid fa-film text-lg"></i>

      </button>

      <button
        onclick="openStickerModal()"
        class="text-slate-400 hover:text-primary p-1.5">

        <i class="fa-solid fa-face-smile text-lg"></i>

      </button>

      <input
        id="chatInput"
        type="text"
        placeholder="Conversar..."
        class="bg-transparent text-slate-100
               placeholder-slate-400 w-full
               focus:outline-none text-sm py-1.5"
      >

      <button
        onclick="sendMessage()"
        class="bg-primary text-white px-3.5 py-1.5
               rounded-lg text-xs font-semibold">

        <i class="fa-solid fa-paper-plane text-xs"></i>

      </button>

    </div>

  </div>

</div>

<!-- =========================================================
     MEMBROS
========================================================= -->

<div
  id="membersSidebar"
  class="absolute md:relative right-0 z-30 w-full md:w-60
         h-full bg-[#111e38] flex-col flex-shrink-0
         border-l border-[#1e293b]
         transition-transform duration-200
         translate-x-full md:translate-x-0
         hidden md:flex">

  <div
    class="h-14 border-b border-[#1e293b] px-4
           flex items-center justify-between md:hidden">

    <span class="font-bold text-slate-100">
      Membros
    </span>

    <button
      onclick="closeMembersSidebar()"
      class="text-slate-300 p-2">

      <i class="fa-solid fa-xmark text-lg"></i>

    </button>

  </div>

  <div class="p-4 flex-1 overflow-y-auto space-y-4">

    <div>

      <p class="text-xs font-bold text-slate-400
                uppercase tracking-wider mb-2">

        Disponível

      </p>

      <div id="onlineMembersList" class="space-y-2"></div>

    </div>

  </div>

</div>

</div>

<!-- =========================================================
     MOBILE NAV
========================================================= -->

<div
  class="md:hidden h-14 bg-[#111e38]
         border-t border-[#1e293b]
         flex items-center justify-around
         z-40 px-2 flex-shrink-0">

  <button
    onclick="switchMobileTab('channels')"
    id="btnTabChannels"
    class="flex flex-col items-center gap-1
           text-slate-400 mobile-tab-active">

    <i class="fa-solid fa-list-ul text-lg"></i>
    <span class="text-[10px] font-medium">Canais</span>

  </button>

  <button
    onclick="switchMobileTab('members')"
    id="btnTabMembers"
    class="flex flex-col items-center gap-1 text-slate-400">

    <i class="fa-solid fa-users text-lg"></i>
    <span class="text-[10px] font-medium">Membros</span>

  </button>

  <button
    onclick="openProfileModal()"
    class="flex flex-col items-center gap-1 text-slate-400">

    <i class="fa-solid fa-user-gear text-lg"></i>
    <span class="text-[10px] font-medium">Perfil</span>

  </button>

</div>

<!-- =========================================================
     MENU DE MENSAGEM
========================================================= -->

<div
  id="messageContextMenu"
  class="fixed z-50 bg-[#111e38]
         border border-[#1e293b]
         rounded-xl shadow-xl w-44 py-1 hidden">

  <button
    onclick="togglePinSelectedMessage()"
    class="w-full text-left px-4 py-2 text-xs
           font-semibold text-slate-200
           hover:bg-[#1e293b] flex items-center gap-2">

    <i id="contextPinIcon"
       class="fa-solid fa-thumbtack text-slate-400"></i>

    <span id="contextPinText">
      Fixar Mensagem
    </span>

  </button>

  <button
    id="contextDeleteBtn"
    onclick="deleteSelectedMessage()"
    class="w-full text-left px-4 py-2 text-xs
           font-semibold text-rose-400
           hover:bg-rose-950/40
           flex items-center gap-2">

    <i class="fa-solid fa-trash"></i>

    Apagar Mensagem

  </button>

</div>

<!-- =========================================================
     PERFIL
========================================================= -->

<div
  id="profileModal"
  class="fixed inset-0 modal-backdrop z-50
         flex items-center justify-center p-4 hidden">

  <div
    class="bg-[#111e38] w-full max-w-md rounded-2xl
           shadow-2xl overflow-hidden
           border border-[#1e293b]">

    <div
      id="modalBannerPreview"
      class="h-24 relative bg-primary
             bg-cover bg-center transition-all">

      <div class="absolute top-2 right-2 flex gap-1.5">

        <input
          type="color"
          id="bannerColorInput"
          onchange="handleBannerColorSelect(event)"
          class="w-7 h-7 rounded-full cursor-pointer
                 border-2 border-white p-0"
        >

        <button
          onclick="triggerBannerInput()"
          class="bg-black/50 text-white
                 w-7 h-7 rounded-full
                 flex items-center justify-center text-xs">

          <i class="fa-solid fa-camera"></i>

        </button>

      </div>

      <input
        type="file"
        id="bannerFileInput"
        accept="image/gif,image/png,image/jpeg,image/webp"
        class="hidden"
        onchange="handleBannerSelect(event)"
      />

      <button
        onclick="closeProfileModal()"
        class="absolute top-2 left-2
               text-white bg-black/40
               w-7 h-7 rounded-full
               flex items-center justify-center">

        <i class="fa-solid fa-xmark text-xs"></i>

      </button>

    </div>

    <div class="p-5 pt-0 relative">

      <div
        class="relative -top-8 mb-[-20px]
               flex items-end justify-between">

        <img
          id="modalAvatarPreview"
          src=""
          class="w-16 h-16 rounded-full
                 border-4 border-[#111e38]
                 bg-slate-800 object-cover shadow"
        >

        <button
          onclick="triggerAvatarInput()"
          class="bg-[#1e293b] text-slate-200
                 px-3 py-1.5 rounded-lg
                 text-xs font-semibold
                 border border-[#334155]">

          Mudar Foto

        </button>

        <input
          type="file"
          id="avatarFileInput"
          accept="image/gif,image/png,image/jpeg,image/webp"
          class="hidden"
          onchange="handleAvatarSelect(event)"
        />

      </div>

      <div class="mt-4 space-y-3">

        <div>

          <label
            class="block text-xs font-bold
                   text-slate-400 uppercase mb-1">

            Nome de Exibição

          </label>

          <input
            id="modalNameInput"
            type="text"
            maxlength="32"
            class="w-full bg-[#0b1329]
                   text-slate-100 px-3 py-2
                   rounded-lg text-sm
                   border border-[#1e293b]
                   focus:outline-none
                   focus:border-primary"
          >

        </div>

        <div>

          <label
            class="block text-xs font-bold
                   text-slate-400 uppercase mb-1">

            Status Personalizado

          </label>

          <input
            id="modalCustomStatusInput"
            type="text"
            maxlength="80"
            class="w-full bg-[#0b1329]
                   text-slate-100 px-3 py-2
                   rounded-lg text-sm
                   border border-[#1e293b]
                   focus:outline-none
                   focus:border-primary"
          >

        </div>

      </div>

      <div
        class="mt-6 flex justify-end gap-2
               pt-3 border-t border-[#1e293b]">

        <button
          onclick="closeProfileModal()"
          class="text-slate-400 text-sm px-3 py-1.5">

          Cancelar

        </button>

        <button
          id="saveProfileBtn"
          onclick="saveProfileChanges()"
          class="bg-primary text-white
                 px-4 py-1.5 rounded-lg
                 text-sm font-semibold shadow">

          Salvar

        </button>

      </div>

    </div>

  </div>

</div>

<!-- =========================================================
     PERFIL DO MEMBRO
========================================================= -->

<div
  id="memberProfileModal"
  class="fixed inset-0 modal-backdrop z-50
         flex items-center justify-center p-4 hidden"
  onclick="if(event.target === this) closeMemberProfileModal()">

  <div
    class="bg-[#111e38] w-full max-w-sm
           rounded-2xl shadow-2xl
           overflow-hidden border border-[#1e293b]">

    <div
      id="memberModalBanner"
      class="h-24 relative bg-primary
             bg-cover bg-center">

      <button
        onclick="closeMemberProfileModal()"
        class="absolute top-2 right-2
               text-white bg-black/50
               w-7 h-7 rounded-full
               flex items-center justify-center">

        <i class="fa-solid fa-xmark text-xs"></i>

      </button>

    </div>

    <div class="p-5 pt-0 relative">

      <div class="relative -top-8 mb-[-10px]">

        <img
          id="memberModalAvatar"
          src=""
          class="w-16 h-16 rounded-full
                 border-4 border-[#111e38]
                 bg-slate-800 object-cover shadow"
        >

      </div>

      <h3
        id="memberModalName"
        class="font-bold text-slate-100 text-base">
      </h3>

      <p
        id="memberModalStatus"
        class="text-xs text-slate-400 mt-1">
      </p>

      <div
        class="mt-5 pt-3 border-t border-[#1e293b]
               flex justify-end">

        <button
          onclick="closeMemberProfileModal()"
          class="bg-[#1e293b]
                 hover:bg-[#334155]
                 text-slate-200
                 px-4 py-1.5 rounded-xl
                 text-xs font-semibold">

          Fechar

        </button>

      </div>

    </div>

  </div>

</div>

<!-- =========================================================
     GIF MODAL
========================================================= -->

<div
  id="gifModal"
  class="fixed inset-0 modal-backdrop z-50
         flex items-center justify-center p-4 hidden">

  <div
    class="bg-[#111e38] w-full max-w-md
           rounded-2xl p-5 shadow-2xl
           border border-[#1e293b]
           flex flex-col max-h-[85vh]">

    <div class="flex justify-between items-center mb-3">

      <h3
        class="font-bold text-slate-100 text-base
               flex items-center gap-2">

        <i class="fa-solid fa-film text-primary"></i>
        GIFs

      </h3>

      <button
        onclick="closeGifModal()"
        class="text-slate-400">

        <i class="fa-solid fa-xmark text-lg"></i>

      </button>

    </div>

    <div
      class="flex border-b border-[#1e293b]
             mb-3 text-xs font-medium text-slate-400">

      <button
        onclick="switchGifTab('library')"
        id="btnGifLibrary"
        class="flex-1 pb-2 subtab-active">

        Explorar

      </button>

      <button
        onclick="switchGifTab('created')"
        id="btnGifCreated"
        class="flex-1 pb-2">

        Meus GIFs

<script>

/* =========================================================
   SOCKET
========================================================= */

const socket = io({
  transports: ['websocket', 'polling'],
  upgrade: true,
  reconnection: true,
  reconnectionAttempts: Infinity,
  reconnectionDelay: 1000
});

/* =========================================================
   ESTADO
========================================================= */

let myId = null;
let isRegisterMode = false;

let currentUser =
  JSON.parse(localStorage.getItem('nexus_user')) || {
    name: "",
    email: "",
    avatar:
      "https://api.dicebear.com/7.x/adventurer/svg?seed=" +
      Math.random(),
    banner: "color:#3b82f6",
    customStatus: "Online"
  };

let currentServer = "servidor1";
let currentChannel = "geral";

let pendingImageBase64 = null;
let pendingAvatarBase64 = null;
let pendingBannerValue = null;
let pendingGifCreatorBase64 = null;

let activeVoiceChannel = null;

let isMicMuted = false;
let isDeafened = false;

let localStream = null;

let peerConnections = {};
let remoteAudioElements = {};

let onlineUsersList = [];

let selectedMessageId = null;
let pressTimer = null;

let currentGifTab = "library";

let createdGifs =
  JSON.parse(localStorage.getItem("nexus_created_gifs") || "[]");

let createdStickers =
  JSON.parse(localStorage.getItem("nexus_created_stickers") || "[]");

/* =========================================================
   WEBRTC
========================================================= */

const rtcConfig = {
  iceServers: [
    {
      urls: "stun:stun.l.google.com:19302"
    }
  ]
};

/* =========================================================
   GIFS
========================================================= */

const sampleGifs = [

  {
    name: "Gato",
    url: "https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif"
  },

  {
    name: "Risada",
    url: "https://media.giphy.com/media/10JhviFuU2gWD6/giphy.gif"
  },

  {
    name: "Aplausos",
    url: "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif"
  },

  {
    name: "Dança",
    url: "https://media.giphy.com/media/3o7btNa0RUYa5E7iiQ/giphy.gif"
  }

];

/* =========================================================
   STICKERS
========================================================= */

const defaultStickers = [

  "https://cdn-icons-png.flaticon.com/128/4265/4265261.png",

  "https://cdn-icons-png.flaticon.com/128/1662/1662531.png",

  "https://cdn-icons-png.flaticon.com/128/4265/4265283.png"

];

/* =========================================================
   SERVIDORES
========================================================= */

const serversData = {

  servidor1: {

    name: "Workspace dos Amigos",

    banner: "color:#3b82f6",

    textChannels: [
      "geral",
      "memes",
      "midia-e-fotos"
    ],

    voiceChannels: [
      "🔊 Sala Geral",
      "🔊 Reunião Squad"
    ]

  }

};

/* =========================================================
   MENSAGENS
========================================================= */

const channelMessages = {};

let renderQueued = false;

/* =========================================================
   DOM READY & GLOBAL LISTENERS
========================================================= */

window.addEventListener("DOMContentLoaded", () => {

  setupSocketListeners();

  setupChatInput();

  checkSavedSession();

});

window.addEventListener("click", (event) => {
  const menu = document.getElementById("messageContextMenu");
  if (menu && !menu.contains(event.target)) {
    closeContextMenu();

});

/* =========================================================
   CHAT INPUT
========================================================= */

function setupChatInput() {

  const input =
    document.getElementById("chatInput");

  input.addEventListener("keydown", event => {

    if (event.key === "Enter") {

      event.preventDefault();

      sendMessage();

}

/* =========================================================
   AUTH
========================================================= */

function checkSavedSession() {

  if (currentUser.email && currentUser.name) {

    document
      .getElementById("authScreen")

    renderUserProfileBar();

    if (window.innerWidth < 768) {

      switchMobileTab("channels");

    }

    emitCurrentUser();

    document
      .getElementById("authScreen")

  }

}

function toggleAuthMode() {

    document.getElementById("authTitle");

    document.getElementById("authSubtitle");

  const registerFields =

  const submitBtn =
    document.getElementById("authSubmitBtn");

    switchBtn.innerHTML =

       <span class="text-primary font-semibold">

       </span>`;

  } else {

    title.innerText =
      "Bem-vindo ao Nexus";

    subtitle.innerText =
      "Faça login para entrar no workspace";

    registerFields.classList.add("hidden");

    submitBtn.innerText = "Entrar";

    switchBtn.innerHTML =
      `Não tem uma conta?
       <span class="text-primary font-semibold">
       Cadastre-se
       </span>`;

  }

}

function handleAuthSubmit() {

  const email =
    document
      .getElementById("authEmailInput")
      .value.trim();

  const password =
    document
      .getElementById("authPasswordInput")
      .value.trim();

  if (!email || !password) {

    alert("Preencha todos os campos obrigatórios!");

    return;

  }

  if (isRegisterMode) {

    const name =
      document
        .getElementById("authNameInput")
        .value.trim();

    if (!name) {

      alert("Insira um nome de exibição.");

      return;

    }

    currentUser.name = name;

  } else {

    currentUser.name =
      email.split("@")[0];

  }

  currentUser.email = email;

  localStorage.setItem(
    "nexus_user",
    JSON.stringify(currentUser)
  );

  document
    .getElementById("authScreen")
    .classList.add("hidden");

  renderUserProfileBar();

  switchServer("servidor1");

  emitCurrentUser();

}

function logout() {

  if (!confirm("Deseja realmente sair da sua conta?")) {

    return;

  }

  if (activeVoiceChannel) {

    disconnectVoice();

  }

  localStorage.removeItem("nexus_user");

  location.reload();

}

/* =========================================================
   SOCKET USER
========================================================= */

function emitCurrentUser() {

  socket.emit("update_user", {

    name: currentUser.name,

    avatar: currentUser.avatar,

    status: currentUser.customStatus,

    banner: currentUser.banner

  });

}

/* =========================================================
   SOCKET LISTENERS
========================================================= */

function setupSocketListeners() {

  socket.on("connection_ready", data => {

    myId = data.id;

  });

  socket.on("users_updated", users => {

    const uniqueUsers = [];

    const seenIds = new Set();

    for (let i = users.length - 1; i >= 0; i--) {

      if (!seenIds.has(users[i].id)) {

        seenIds.add(users[i].id);

        uniqueUsers.unshift(users[i]);

      }

    }

    onlineUsersList = uniqueUsers;

    renderMembers();

    renderVoiceChannels();

  });

  socket.on("channel_history", data => {

    channelMessages[data.channelKey] =
      Array.isArray(data.messages)
        ? data.messages
        : [];

    if (
      data.channelKey ===
      `${currentServer}-${currentChannel}`
    ) {

      queueRenderMessages();

    }

  });

  socket.on("receive_message", msg => {

    const key =
      `${msg.server}-${msg.channel}`;

    if (!channelMessages[key]) {

      channelMessages[key] = [];

    }

    channelMessages[key].push(msg);

    if (
      msg.server === currentServer &&
      msg.channel === currentChannel
    ) {

      queueRenderMessages();

    }

  });

  socket.on("message_pinned_toggled", data => {

    const key =
      `${data.server}-${data.channel}`;

    if (!channelMessages[key]) return;

    const msg =
      channelMessages[key].find(
        m => Number(m.id) === Number(data.id)
      );

    if (msg) {

      msg.pinned = data.pinned;

      queueRenderMessages();

    }

  });

  socket.on("message_deleted", data => {

    const key =
      `${data.server}-${data.channel}`;

    if (!channelMessages[key]) return;

    channelMessages[key] =
      channelMessages[key].filter(
        m => Number(m.id) !== Number(data.id)
      );

    queueRenderMessages();

  });

  /* =======================================================
     VOZ
  ======================================================= */

  socket.on("user_joined_voice", async userId => {

    if (!localStream) return;

    await createOfferForUser(userId);

  });

  socket.on("voice_user_present", async userId => {

    if (!localStream) return;

    await createOfferForUser(userId);

  });

  socket.on("voice_offer", async data => {

    try {

      if (!localStream) return;

      const pc =
        createPeerConnection(data.sender);

      await pc.setRemoteDescription(
        new RTCSessionDescription(data.offer)
      );

      const answer =
        await pc.createAnswer();

      await pc.setLocalDescription(answer);

      socket.emit("voice_answer", {

        target: data.sender,

        answer

      });

    } catch (error) {

      console.warn(
        "Erro ao processar oferta de voz:",
        error
      );

    }

  });

  socket.on("voice_answer", async data => {

    try {

      const pc =
        peerConnections[data.sender];

      if (!pc) return;

      await pc.setRemoteDescription(
        new RTCSessionDescription(data.answer)
      );

    } catch (error) {

      console.warn(
        "Erro ao processar resposta:",
        error
      );

    }

  });

  socket.on("ice_candidate", async data => {

    try {

      const pc =
        peerConnections[data.sender];

      if (!pc) return;

      await pc.addIceCandidate(
        new RTCIceCandidate(data.candidate)
      );

    } catch (error) {

      console.warn(
        "ICE candidate ignorado:",
        error
      );

    }

  });

  socket.on("user_left_voice", userId => {

    removePeerConnection(userId);

  });

}

/* =========================================================
   WEBRTC OTIMIZADO
========================================================= */

async function createOfferForUser(userId) {

  if (!localStream) return;

  if (userId === myId) return;

  const pc =
    createPeerConnection(userId);

  try {

    const offer =
      await pc.createOffer({
        offerToReceiveAudio: true
      });

    await pc.setLocalDescription(offer);

    socket.emit("voice_offer", {

      target: userId,

      offer

    });

  } catch (error) {

    console.warn(
      "Erro criando oferta:",
      error
    );

  }

}

function createPeerConnection(userId) {

  if (peerConnections[userId]) {

    return peerConnections[userId];

  }

  const pc =
    new RTCPeerConnection(rtcConfig);

  peerConnections[userId] = pc;

  if (localStream) {

    localStream
      .getAudioTracks()
      .forEach(track => {

        pc.addTrack(
          track,
          localStream
        );

      });

  }

  pc.ontrack = event => {

    if (!event.streams || !event.streams[0]) {

      return;

    }

    createRemoteAudio(
      userId,
      event.streams[0]
    );

  };

  pc.onicecandidate = event => {

    if (!event.candidate) return;

    socket.emit("ice_candidate", {

      target: userId,

      candidate: event.candidate

    });

  };

  pc.onconnectionstatechange = () => {

    const state =
      pc.connectionState;

    if (
      state === "failed" ||
      state === "closed" ||
      state === "disconnected"
    ) {

      setTimeout(() => {

        if (
          peerConnections[userId] === pc
        ) {

          removePeerConnection(userId);

        }

      }, 2000);

    }

  };

  return pc;

}

function createRemoteAudio(userId, stream) {

  let audio =
    remoteAudioElements[userId];

  if (!audio) {

    audio =
      document.createElement("audio");

    audio.autoplay = true;

    audio.playsInline = true;

    audio.volume = 1;

    audio.dataset.userId = userId;

    document
      .getElementById("remoteAudios")
      .appendChild(audio);

    remoteAudioElements[userId] =
      audio;

  }

  if (audio.srcObject !== stream) {

    audio.srcObject = stream;

  }

  if (!isDeafened) {

    audio.play().catch(() => {});

  }

}

function removePeerConnection(userId) {

  if (peerConnections[userId]) {

    try {

      peerConnections[userId].close();

    } catch (_) {}

    delete peerConnections[userId];

  }

  if (remoteAudioElements[userId]) {
    try {
      remoteAudioElements[userId].pause();
    } catch (_) {}

    remoteAudioElements[userId].srcObject = null;

    remoteAudioElements[userId].remove();

    delete remoteAudioElements[userId];

  }

}

/* =========================================================
   SERVIDOR
========================================================= */

function switchServer(serverId) {

  currentServer = serverId;

  const server =
    serversData[serverId];

  document
    .getElementById("currentServerTitle")

  applyBannerStyle(
    document.getElementById("serverHeaderBanner"),

    button.innerHTML =

    button.onclick =

  });

  renderVoiceChannels();

  selectChannel(server.textChannels[0]);

  renderMembers();

}

/* =========================================================
   CANAL
========================================================= */

function selectChannel(channelName) {

/* =========================================================
   MENSAGENS
========================================================= */

function sendMessage() {

  const input =
    document.getElementById("chatInput");

  const text =
    input.value.trim();

  if (!text && !pendingImageBase64) {

    return;

  }

  const messageData = {

    id: Date.now(),

    server: currentServer,

    channel: currentChannel,

    channelKey:
      `${currentServer}-${currentChannel}`,

    author: currentUser.name,

    authorId: myId,

    avatar: currentUser.avatar,

    banner: currentUser.banner,

    status: currentUser.customStatus,

    time:
      new Date().toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      ),

    text,

    image: pendingImageBase64,

    pinned: false

  };

  input.value = "";

  cancelImageUpload();

  socket.emit(
    "send_message",
    messageData
  );

}

function sendGif(url) {

  if (!url) return;

  const messageData = {

    id: Date.now(),

    server: currentServer,

    channel: currentChannel,

    channelKey:
      `${currentServer}-${currentChannel}`,

    author: currentUser.name,

    authorId: myId,

    avatar: currentUser.avatar,

    banner: currentUser.banner,

    time:
      new Date().toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      ),

    text: "",

    image: url,

    isGif: true,

    pinned: false

    "send_message",

function sendSticker(url) {

  const messageData = {

    id: Date.now(),

    server: currentServer,

    channel: currentChannel,

      `${currentServer}-${currentChannel}`,

    author: currentUser.name,

          hour: "2-digit",

        }

    "send_message",

  closeStickerModal();

/* =========================================================
   RENDER OTIMIZADO
========================================================= */

function queueRenderMessages() {

  if (renderQueued) return;

  renderQueued = true;

  requestAnimationFrame(() => {

    renderQueued = false;

    renderMessages();

  });

}

function renderMessages() {

  const container =
    document.getElementById("chatMessages");

  const key =
    `${currentServer}-${currentChannel}`;

  const messages =
    channelMessages[key] || [];

  const wasNearBottom =
    container.scrollHeight -
    container.scrollTop -
    container.clientHeight <
    120;

  const fragment =
    document.createDocumentFragment();

  messages.forEach(msg => {

    const element =
      document.createElement("div");

    element.className =
      `msg-item flex items-start gap-3
       p-1.5 rounded-xl transition
       ${msg.pinned
         ? "bg-amber-950/40 border border-amber-900/50"
         : ""}`;

    element.dataset.msgId =
      msg.id;

    element.oncontextmenu = event => {

      event.preventDefault();

      openContextMenu(
        event,
        msg.id
      );

    };

    element.ontouchstart =
      event => {

        handleTouchStart(
          event,
          msg.id
        );

      };

    element.ontouchend =
      handleTouchEnd;

    const avatar =
      msg.avatar ||
      "https://api.dicebear.com/7.x/adventurer/svg?seed=fallback";

    const author =
      escapeHtml(
        msg.author || "Usuário"
      );

    const text =
      escapeHtml(
        msg.text || ""
      );

    let media = "";

    if (msg.image) {

      media =
        `<img
          src="${escapeAttribute(msg.image)}"
          loading="lazy"
          decoding="async"
          class="media-message mt-2 rounded-xl
                 shadow border border-[#1e293b]
                 cursor-pointer"
          onclick="openLightbox(this.src)"
        >`;

    } else if (msg.sticker) {

      media =
        `<img
          src="${escapeAttribute(msg.sticker)}"
          loading="lazy"
          class="w-24 h-24 object-contain"
        >`;

    }

    const pin =
      msg.pinned
        ? `<span
             class="text-[10px] text-amber-400
                    bg-amber-950/80 font-semibold

async function toggleVoiceRoom(channelName) {

  if (activeVoiceChannel === channelName) {

    await disconnectVoice();

    return;

  }

  if (activeVoiceChannel) {

    await disconnectVoice();

  }

  try {

    const button =
      [...document.querySelectorAll(
        "#voiceChannelsList > div"
      )].find(el =>
        el.innerText.includes(channelName)
      );

    if (button) {

      button.style.opacity = ".6";

    }

    localStream =
      await navigator.mediaDevices.getUserMedia({

        audio: {

          echoCancellation: true,

          noiseSuppression: true,

          autoGainControl: true,

          channelCount: 1

        },

        video: false

      });

    activeVoiceChannel =
      channelName;

    socket.emit(
      "join_voice",
      channelName
    );

    document
      .getElementById(
        "connectedVoiceChannelName"
      )
      .innerText =
      channelName;

    document
      .getElementById(
        "voiceConnectedPanel"
      )
      .classList.remove("hidden");

    applyMicState();

    applyDeafenState();

    renderVoiceChannels();

  } catch (error) {

    console.error(error);

    localStream = null;

    activeVoiceChannel = null;

    alert(
      "Não foi possível acessar o microfone. Verifique a permissão do navegador."
    );

    renderVoiceChannels();

  }

}

async function disconnectVoice() {

  if (!activeVoiceChannel) return;

  const oldChannel =
    activeVoiceChannel;

  activeVoiceChannel = null;

  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => {

        try {
          track.stop();
        } catch (_) {}

      });

    localStream = null;

  }

  Object.keys(peerConnections)
    .forEach(removePeerConnection);

  socket.emit(
    "leave_voice",
    oldChannel
  );

  document
    .getElementById(
      "voiceConnectedPanel"
    )
    .classList.add("hidden");

  renderVoiceChannels();

}

function toggleMuteMic() {

  if (!localStream) {

    alert("Entre em uma sala de voz primeiro.");

    return;

  }

  isMicMuted =
    !isMicMuted;

  applyMicState();

}

function toggleDeafen() {

  isDeafened =
    !isDeafened;

  if (isDeafened) {

    isMicMuted = true;

  }

  Object.values(
    remoteAudioElements
  ).forEach(audio => {

    audio.muted =
      isDeafened;

  });

  applyMicState();

  applyDeafenState();

}

function applyMicState() {

  if (localStream) {

    localStream
      .getAudioTracks()
      .forEach(track => {

        track.enabled =
          !isMicMuted;

      });

  }

  const button =
    document.getElementById(
      "btnMuteMic"
    );

  if (isMicMuted) {

    button.className =
      "w-8 h-8 rounded-lg flex items-center " +
      "justify-center bg-rose-500 text-white";

    button.innerHTML =
      '<i class="fa-solid fa-microphone-slash text-sm"></i>';

  } else {

    button.className =
      "w-8 h-8 rounded-lg flex items-center " +
      "justify-center hover:bg-slate-800 text-slate-300";

    button.innerHTML =
      '<i class="fa-solid fa-microphone text-sm"></i>';

  }

}

function applyDeafenState() {

  const button =
    document.getElementById(
      "btnDeafen"
    );

  if (isDeafened) {

    button.className =
      "w-8 h-8 rounded-lg flex items-center " +
      "justify-center bg-rose-500 text-white";

    button.innerHTML =
      '<i class="fa-solid fa-headphones-simple text-sm"></i>';

    button.className =

/* =========================================================
   PROCESSAMENTO DE IMAGENS
========================================================= */

function processProfileImage(file, callback) {

  const maxSize =
    8 * 1024 * 1024;

  if (file.size > maxSize) {

    alert(
      "A imagem precisa ter no máximo 8 MB."
    );

    return;

  }

  if (
    file.type === "image/gif"
  ) {

    const reader =
      new FileReader();

    reader.onload =
      event => {

        callback(
          event.target.result
        );

      };

    reader.readAsDataURL(file);

    return;

  }

  const reader =
    new FileReader();

  reader.onload =
    event => {

      const image =
        new Image();

      image.onload =
        () => {

          const maxDimension =
            1200;

          let width =
            image.width;

          let height =
            image.height;

          if (
            width > maxDimension ||
            height > maxDimension
          ) {

            const ratio =
              Math.min(
                maxDimension / width,
                maxDimension / height
              );

            width *= ratio;
            height *= ratio;

          }

          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width =
            Math.round(width);

          canvas.height =
            Math.round(height);

          const ctx =
            canvas.getContext(
              "2d"
            );

          ctx.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
          );

          callback(
            canvas.toDataURL(
              "image/webp",
              .82
            )
          );

        };

      image.src =
        event.target.result;

    };

  reader.readAsDataURL(file);

}

function applyBannerStyle(
  element,
  value
) {

  if (!element) return;

  element.style.backgroundImage =
    "none";

  element.style.backgroundColor =
    "#3b82f6";

  if (!value) return;

  if (
    value.startsWith("color:")
  ) {

    element.style.backgroundColor =
      value.replace(
        "color:",
        ""
      );

    return;

  }

  if (
    value.startsWith("url(")
  ) {

    element.style.backgroundColor =
      "transparent";

    element.style.backgroundImage =
      value;

    return;

  }

  element.style.backgroundColor =
    "transparent";

  element.style.backgroundImage =
    `url('${value}')`;

}

    item.innerHTML = `

      <img
        src="${escapeAttribute(avatar)}"
        loading="lazy"
        class="w-8 h-8 rounded-full
               object-cover
               border border-[#1e293b]"
      >

      <div class="flex flex-col min-w-0">

        <span
          class="text-xs font-bold
                 text-slate-100 truncate">

          ${escapeHtml(name)}

        </span>

        <span
          class="text-[10px]
                 text-slate-400 truncate">

          ${escapeHtml(status)}

        </span>

      </div>

    `;

    fragment.appendChild(item);

  });

  container.replaceChildren(
    fragment
  );

}

/* =========================================================
   PERFIL MEMBRO
========================================================= */

function openMemberProfileByName(name) {

  if (
    name === currentUser.name
  ) {

    openMemberProfile(
      currentUser.name,
      currentUser.avatar,
      currentUser.customStatus,
      currentUser.banner
    );

    return;

  }

  const member =
    onlineUsersList.find(
      user =>
        user.name === name
    );

  if (member) {

    openMemberProfile(
      member.name,
      member.avatar,
      member.status,
      member.banner
    );

  } else {

    openMemberProfile(
      name,
      "https://api.dicebear.com/7.x/adventurer/svg?seed=fallback",
      "Online",
      "color:#3b82f6"
    );

  }

}

function openMemberProfile(
  name,
  avatar,
  status,
  banner
) {

  document
    .getElementById(
      "memberModalName"
    )

  document
    .getElementById(
      "memberModalStatus"

  document
    .getElementById(
      "memberModalAvatar"
    )
    .src =
    avatar ||
    "https://api.dicebear.com/7.x/adventurer/svg?seed=fallback";

  applyBannerStyle(

      "memberModalBanner"
    ),
    banner ||
    "color:#3b82f6"
  );

  document
    .getElementById(
      "memberProfileModal"

}

function closeMemberProfileModal() {

  document
    .getElementById(
      "memberProfileModal"
    )
    .classList.add(
      "hidden"
    );

}

/* =========================================================
   MOBILE
========================================================= */

function switchMobileTab(tab) {

  const left =
    document.getElementById(
      "leftSidebar"
    );

  const members =
    document.getElementById(
      "membersSidebar"
    );

  document
    .getElementById(
      "btnTabChannels"
    )
    .classList.remove(
      "mobile-tab-active"
    );

  document
    .getElementById(
      "btnTabMembers"
    )
    .classList.remove(
      "mobile-tab-active"
    );

  if (tab === "channels") {

    left.classList.remove(
      "-translate-x-full",
      "hidden"
    );

    members.classList.add(
      "translate-x-full"
    );

    members.classList.remove(
      "flex"
    );

    document
      .getElementById(
        "btnTabChannels"
      )
      .classList.add(
        "mobile-tab-active"
      );

  }

  if (tab === "members") {

    left.classList.add(
      "-translate-x-full"
    );

    left.classList.remove(
      "hidden"
    );

    members.classList.remove(
      "translate-x-full",
      "hidden"
    );

    members.classList.add(
      "flex"
    );

    document
      .getElementById(
        "btnTabMembers"
      )
      .classList.add(
        "mobile-tab-active"
      );

  }

}

function toggleMobileSidebar() {

  switchMobileTab(
    "channels"
  );

}

function toggleMembersSidebar() {

  switchMobileTab(
    "members"
  );

}

function closeMembersSidebar() {

  switchMobileTab(
    "channels"
  );

}

function closeMobileSidebars() {

  if (
    window.innerWidth < 768
  ) {

    document
      .getElementById(
        "leftSidebar"
      )
      .classList.add(
        "-translate-x-full"
      );

    document
      .getElementById(
        "membersSidebar"
      )
      .classList.add(
        "translate-x-full"
      );

  }

}

/* =========================================================
   CONTEXTO MENSAGEM
========================================================= */

function handleTouchStart(
  event,
  id
) {

  pressTimer =
    setTimeout(() => {

      openContextMenu(
        event.touches[0],
        id
      );

    }, 500);

}

function handleTouchEnd() {

  if (pressTimer) {

    clearTimeout(
      pressTimer
    );

    pressTimer = null;

  }

}

function openContextMenu(
  event,
  id
) {

  selectedMessageId =
    id;

  const key =
    `${currentServer}-${currentChannel}`;

  const msg =
    (channelMessages[key] || [])
      .find(
        m =>
          Number(m.id) ===
          Number(id)
      );

  const pinText =
    document.getElementById(
      "contextPinText"
    );

  const pinIcon =
    document.getElementById(
      "contextPinIcon"
    );

  if (
    msg &&
    msg.pinned
  ) {

    pinText.innerText =
      "Desafixar Mensagem";

    pinIcon.className =
      "fa-solid fa-thumbtack text-amber-400";

  } else {

    pinText.innerText =
      "Fixar Mensagem";

    pinIcon.className =
      "fa-solid fa-thumbtack text-slate-400";

  }

  const deleteBtn =
    document.getElementById(
      "contextDeleteBtn"
    );

  if (
    msg &&
    (
      msg.authorId === myId ||
      msg.author === currentUser.name
    )
  ) {

    deleteBtn.classList.remove(
      "hidden"
    );

  } else {

    deleteBtn.classList.add(
      "hidden"
    );

  }

  const menu =
    document.getElementById(
      "messageContextMenu"
    );

  const x =
    Math.min(
      event.clientX,
      window.innerWidth - 185
    );

  const y =
    Math.min(
      event.clientY,
      window.innerHeight - 110
    );

  menu.style.left =
    Math.max(5, x) + "px";

  menu.style.top =
    Math.max(5, y) + "px";

  menu.classList.remove(
    "hidden"
  );

}

function closeContextMenu() {

  const menu =
    document.getElementById(
      "messageContextMenu"
    );

  if (menu) {

    menu.classList.add(
      "hidden"
    );

  }

}

function togglePinSelectedMessage() {

  if (!selectedMessageId)
    return;

  const key =
    `${currentServer}-${currentChannel}`;

  const msg =
    (channelMessages[key] || [])
      .find(
        m =>
          Number(m.id) ===
          Number(selectedMessageId)
      );

  if (!msg) return;

  socket.emit(
    "toggle_pin",
    {
      channelKey: key,
      id: msg.id,
      pinned: !msg.pinned
    }
  );

  closeContextMenu();

}

function deleteSelectedMessage() {

  if (!selectedMessageId)
    return;

  const key =
    `${currentServer}-${currentChannel}`;

  socket.emit(
    "delete_message",
    {
      channelKey: key,
      id: Number(selectedMessageId),
      server: currentServer,
      channel: currentChannel
    }
  );

  closeContextMenu();

}

/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.innerText =
    String(text ?? "");

  return div.innerHTML;

}

function escapeAttribute(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

}

/* =========================================================
   LIMPEZA AO FECHAR A PÁGINA
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    if (localStream) {

      localStream
        .getTracks()
        .forEach(track => {

          try {
            track.stop();
          } catch (_) {}

        });

    }

    Object.keys(
      peerConnections
    ).forEach(id => {

      try {

        peerConnections[id].close();

      } catch (_) {}

    });

  }
);
